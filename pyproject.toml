[project]
name = "mcp-tidal"
version = "0.1.0"
description = "MCP server for TIDAL music streaming API"
authors = [{ name = "Kien N", email = "contact@kien.cc" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.2.0",
    "tidalapi>=0.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
mcp-tidal = "mcp_tidal.server:main"
mcp-tidal-sse = "mcp_tidal.server:main_sse"
mcp-tidal-http = "mcp_tidal.server:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tidal"]
